# ==========================================
# 顶级科技大厂风 极客博客终极配置文件
# ==========================================

# 1. 网站基础信息
title: 数字空间                     # 博客大标题
tagline: 苟着发育成型，做大后期玩家    # 博客副标题
description: >-                     # 搜索引擎描述
  记录信息差、硬核工具与概率论打法。下行风险有限，上行收益无限。
url: 'https://rjjmrx.github.io' # 明天域名通了改你的新域名
author: 你的名字                   # 作者名

# 2. 语言与时区
lang: zh-CN
timezone: Asia/Shanghai

# 3. 主题与视觉样式（强行锁定暗黑大厂风）
theme_mode: dark                    # 默认深色模式

# 4. 侧边栏与个人头像装扮
avatar: 'https://github.com/github.png' # 默认极客头像，可换成你自己的图片链接
sidebar:
  layout: left
  collapsible: true

# 5. 极客实用功能（代码高亮 + 悬浮目录 + 阅读时间预测）
kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: true            # 代码块强制显示行号
      bold_every: 5

toc: true                            # 自动生成右侧文章目录（TOC）
pwa:
  enabled: true                      # 开启 PWA（别人可以在手机/电脑上把你的网站当 App 安装）

# 6. 社交图标与引流配置（直接链接你的 X / GitHub）
social:
  name: 你的名字
  email: ''
  links:
    - https://github.com/你的GitHub用户名   # 你的 GitHub 主页
    - https://x.com/                         # 你的 X (Twitter) 账号链接

# 7. 谷歌/搜索引擎 SEO 优化
seo:
  twitter:
    username: ''                     # 你的 X 绑定的用户名

# 8. 编译排外（防止无关文件占用编译时间）
exclude:
  - vendor
  - .github
