<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 网页名字与浏览器标签设定 -->
    <title>岳绮罗</title>
    <!-- 网页小图标 (Favicon) -->
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/128/18118/18118715.png">
    
    <!-- 引入现代字体与图标库 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --glass-bg: rgba(15, 23, 42, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* 动态精美壁纸背景（支持更换外链图片） */
        .bg-wallpaper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('file:///D:/%E5%B0%91%E7%88%B7/52.webp') no-repeat center center/cover;
            filter: brightness(0.5);
            z-index: -2;
            transition: transform 0.5s ease;
        }

        /* 玻璃拟态毛玻璃遮罩层 */
        .glass-container {
            width: 90%;
            max-width: 680px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            animation: fadeIn 1s ease-out;
            margin: 2rem 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 个人基本信息区 */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 1.5rem;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            object-fit: cover;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        .profile-info h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.3rem;
        }

        .profile-info p {
            color: var(--text-sub);
            font-size: 0.95rem;
        }

        /* 内容板块 */
        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.8rem;
            color: var(--accent);
            letter-spacing: 0.05em;
        }

        .bio-text {
            color: #cbd5e1;
            font-size: 1rem;
            line-height: 1.7;
            margin-bottom: 2rem;
        }

        /* 社交/链接按钮组 */
        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .link-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 0.75rem 1rem;
            border-radius: 10px;
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .link-btn:hover {
            background: var(--accent);
            color: #0f172a;
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(56, 189, 248, 0.3);
        }

        /* 在线音乐播放器组件 */
        .music-player {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .music-meta {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .music-icon {
            font-size: 1.5rem;
            color: var(--accent);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        .music-info .song-name {
            font-size: 0.95rem;
            font-weight: 500;
        }

        .music-info .song-artist {
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .play-btn {
            background: var(--accent);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            color: #0f172a;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .play-btn:hover {
            transform: scale(1.1);
        }

        /* 页脚版权 */
        footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.8rem;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

    <!-- 背景大图壁纸 (你可以随时把下面 url 里的图片链接换成你喜欢的网图) -->
    <div class="bg-wallpaper"></div>

    <div class="glass-container">
        <!-- 头部信息 -->
        <div class="profile-header">
            <!-- 头像图片链接，可替换 -->
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" alt="Avatar" class="avatar">
            <div class="profile-info">
                <h1>Yueqi Luo</h1>
                <p>Digital Creator & Explorer</p>
            </div>
        </div>

        <!-- 简介 -->
        <div class="section-title">ABOUT ME</div>
        <div class="bio-text">
            你好，我是 Yueqi。这里是我的个人独立数字空间。我热爱技术、设计以及所有具有创造力的事物。通过代码与文字，构建属于自己的赛博灯塔。
        </div>

        <!-- 常用链接/社交主页 -->
        <div class="section-title">CONNECT</div>
        <div class="links-grid">
            <a href="https://github.com/rjjmrx" target="_blank" class="link-btn">
                <i class="fab fa-github"></i> GitHub
            </a>
            <a href="mailto:your-email@domain.com" class="link-btn">
                <i class="fas fa-envelope"></i> Email
            </a>
            <a href="#" class="link-btn">
                <i class="fas fa-blog"></i> Blog
            </a>
            <a href="#" class="link-btn">
                <i class="fas fa-compass"></i> Projects
            </a>
        </div>

        <!-- 在线音乐播放器 -->
        <div class="section-title">BACKGROUND MUSIC</div>
        <div class="music-player">
            <div class="music-meta">
                <i class="fas fa-compact-disc music-icon" id="discIcon"></i>
                <div class="music-info">
                    <div class="song-name">Lofi Study & Chill</div>
                    <div class="song-artist">Ambient Beat</div>
                </div>
            </div>
            <!-- 音频控制按钮 -->
            <button class="play-btn" id="playBtn" onclick="togglePlay()">
                <i class="fas fa-play" id="playIcon"></i>
            </button>
        </div>

        <!-- 隐藏的音频源（你可以换成你喜欢的在线音乐直链 MP3） -->
        <audio id="bgMusic" loop>
            <source src="https://www.bensound.com/bensound-music/bensound-relaxing.mp3" type="audio/mp3">
            您的浏览器不支持音频播放。
        </audio>

        <!-- 页脚 -->
        <footer>
            © 2026 Yueqi Luo. Hosted on GitHub Pages.
        </footer>
    </div>

    <script>
        const audio = document.getElementById('bgMusic');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const discIcon = document.getElementById('discIcon');

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                playIcon.classList.remove('fa-play');
                playIcon.classList.add('fa-pause');
                discIcon.style.animationPlayState = 'running';
            } else {
                audio.pause();
                playIcon.classList.remove('fa-pause');
                playIcon.classList.add('fa-play');
                discIcon.style.animationPlayState = 'paused';
            }
        }
    </script>
</body>
</html>
